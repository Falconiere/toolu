# toolu rust-quality scaffold template — clippy.toml
# Clippy lint thresholds copied into a target repo's crate root by the
# rust-refactor command. rust-quality merges only missing keys (never clobbers).
cognitive-complexity-threshold = 20
allow-expect-in-tests = true
allow-unwrap-in-tests = true
too-many-lines-threshold = 150
too-many-arguments-threshold = 6
type-complexity-threshold = 250
msrv = "1.85"
stack-size-threshold = 512000
allowed-idents-below-min-chars = ["i", "j", "k", "n", "x", "y", "z", "id", "db"]
avoid-breaking-exported-api = true
disallowed-methods = []

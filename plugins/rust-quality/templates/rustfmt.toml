# toolu rust-quality scaffold template — rustfmt.toml
# Copied into a target repo's crate root by the rust-refactor command.
# Edit thresholds to taste; rust-quality merges only missing keys (never clobbers).
edition = "2024"
max_width = 100
use_small_heuristics = "Default"
tab_spaces = 2
reorder_imports = true
reorder_modules = true
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
match_block_trailing_comma = true

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toolu · execution dashboard</title>
    <!-- Tailwind Play CDN (no build); see plan deviation s9 for the runtime-CDN trade-off. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              bg: "#0f1115",
              panel: "#171a21",
              panel2: "#1d212b",
              ink: "#e6e9ef",
              muted: "#8b94a7",
              line: "#2a2f3a",
              accent: "#4aa3ff",
              ok: "#2ecc71",
              warn: "#f1c40f",
              bad: "#e74c3c",
            },
            fontFamily: {
              mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/static/styles.css" />
    <!-- Preload the lane modules so the SPA's first render has them warm. The
         history lane (#history-lane) is rendered into #root by app.js. -->
    <link rel="modulepreload" href="/static/history.js" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  </head>
  <body class="bg-bg text-ink font-sans antialiased">
    <div id="root"></div>
    <noscript>This dashboard needs JavaScript (and network access for the React/Tailwind CDNs).</noscript>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>

id: no-hardcoded-color-css
language: Css
severity: error
message: Put colors in tokens.css and reference a custom property.
files:
  - '**/*.css'
ignores:
  - '**/tokens.css'
rule:
  any:
    - kind: color_value
      regex: '^#[0-9a-fA-F]{3,8}$'
    - kind: call_expression
      regex: '^(rgb|rgba|hsl|hsla)\('

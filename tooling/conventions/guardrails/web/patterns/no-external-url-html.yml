id: no-external-url-html
language: Html
severity: error
message: Dashboard assets must not load external URLs.
files:
  - '**/*.html'
rule:
  any:
    - kind: attribute_value
      regex: '(?i)https?://'
    - kind: text
      regex: '(?i)https?://'
    - kind: raw_text
      regex: '(?i)https?://'
    - kind: comment
      regex: '(?i)https?://'

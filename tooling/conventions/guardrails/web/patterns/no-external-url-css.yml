id: no-external-url-css
language: Css
severity: error
message: Dashboard assets must not load external URLs.
files:
  - '**/*.css'
rule:
  any:
    - kind: string_content
      regex: '(?i)https?://'
    - kind: plain_value
      regex: '(?i)https?://'
    - kind: comment
      regex: '(?i)https?://'

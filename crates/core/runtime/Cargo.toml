[package]
name = "toolu-runtime"
description = "toolu core: the runtime layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
# `geteuid` for the ownership rule of `git` discovery (#415); `gethostname`
# for the machine name of the epic status API (#657).
nix = { workspace = true, features = ["hostname", "user"] }
serde.workspace = true
serde_json.workspace = true
# Codex marketplace pin status from config.toml (#626).
toml.workspace = true
toolu-protocol = { path = "../protocol" }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "process_guard"
harness = false

[lints]
workspace = true

[package]
name = "toolu-code-review"
description = "toolu code-review plugin: the `toolu code-review` namespace and its report contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
regex.workspace = true
# SHA-256 of the replay store's request keys; already linked by toolu-http's rustls.
ring = { version = "0.17", default-features = false }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toolu-engine = { path = "../core/engine" }
toolu-jev-client = { path = "../core/jev" }
toolu-openrouter = { path = "../core/openrouter" }
toolu-protocol = { path = "../core/protocol" }
toolu-runtime = { path = "../core/runtime" }
toolu-state = { path = "../core/state" }

[dev-dependencies]
jsonschema.workspace = true
toolu-http-test-support = { path = "../http-test-support" }

[lints]
workspace = true

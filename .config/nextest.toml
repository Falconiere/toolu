# The gate runs the workspace tests under `cargo llvm-cov nextest`.

# status_budget times a real status server's replies (poll p90 <= 7 ms). It
# was the only test in its binary, so `cargo test` ran it with the machine to
# itself; it keeps every test slot here, so nothing else runs beside it.
[[profile.default.overrides]]
filter = 'binary(status_budget)'
threads-required = 'num-test-threads'

# The xtask fixtures each run a nested `cargo xtask gate` build (cargo-deny, clippy,
# llvm-cov) that floods the disk. Beside them, timing-bound tests failed in the
# container gate: the golden quality replays slowed from 15 s to 114 s and hit
# jscpd's 10 s timeout, a 2 s doctor bound took 10.7 s, and interleave's lock
# wait expired. So a fixture keeps every test slot and nothing runs beside it.
[[profile.default.overrides]]
filter = 'package(xtask) & binary(/^fixtures_/)'
threads-required = 'num-test-threads'

# Every doctor case runs doctor's 1 s `command -v` and `--hook-protocol` probes, and
# two bound their own run at 2 s or 5 s. They failed in the container gate at the
# start of the run, when every instrumented test binary loads at once (10.4 s), and
# on a slow target filesystem. Two of them probe a copy of the instrumented toolu:
# in the container the hard link fails across the target volume, so the copy loads
# cold. Alone each takes about 1.5 s. The whole binary is matched so a new or
# renamed case cannot silently fall out of the override.
[[profile.default.overrides]]
filter = 'binary(doctor)'
threads-required = 'num-test-threads'

# The TypeScript replays run jscpd under the hook's 10 s timeout. In the container gate
# two duplication replays timed out and came back empty, so the test runs alone here,
# and inside it the jscpd cases run after its worker pool. Alone it takes about 11 s.
[[profile.default.overrides]]
filter = 'binary(golden_quality) & test(=ts_quality_replays_every_golden_case)'
threads-required = 'num-test-threads'

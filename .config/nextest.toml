# The gate runs the workspace tests under `cargo llvm-cov nextest`.

# status_budget times a real status server's replies (poll p90 <= 7 ms). It
# was the only test in its binary, so `cargo test` ran it with the machine to
# itself; it keeps every test slot here, so nothing else runs beside it.
[[profile.default.overrides]]
filter = 'binary(status_budget)'
threads-required = 'num-test-threads'

# The xtask fixtures each run a nested `cargo xtask gate` build (cargo-deny, clippy,
# llvm-cov) that floods the disk. Beside them, timing-bound tests failed in the
# container gate: the golden quality replays slowed from 15 s to 114 s and hit
# jscpd's 10 s timeout, a 2 s doctor bound took 10.7 s, and interleave's lock
# wait expired. So a fixture keeps every test slot and nothing runs beside it.
[[profile.default.overrides]]
filter = 'package(xtask) & binary(/^fixtures_/)'
threads-required = 'num-test-threads'

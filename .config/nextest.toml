# The gate runs the workspace tests under `cargo llvm-cov nextest`.

# status_budget times a real status server's replies (poll p90 <= 7 ms). It
# was the only test in its binary, so `cargo test` ran it with the machine to
# itself; it keeps every test slot here, so nothing else runs beside it.
[[profile.default.overrides]]
filter = 'binary(status_budget)'
threads-required = 'num-test-threads'

# The xtask fixtures each run a nested `cargo xtask gate` build (cargo-deny, clippy,
# llvm-cov) that floods the disk. Beside them, timing-bound tests failed in the
# container gate: the golden quality replays slowed from 15 s to 114 s and hit
# jscpd's 10 s timeout, a 2 s doctor bound took 10.7 s, and interleave's lock
# wait expired. So a fixture keeps every test slot and nothing runs beside it.
[[profile.default.overrides]]
filter = 'package(xtask) & binary(/^fixtures_/)'
threads-required = 'num-test-threads'

# These doctor cases are bound by doctor's 1 s `--hook-protocol` probe or bound
# their own run at 2 s. They failed in the container gate at the start of the run,
# when every instrumented test binary loads at once (10.4 s), and on a slow target
# filesystem. Two of them probe a copy of the instrumented toolu: in the container
# the hard link fails across the target volume, so the copy loads cold. Alone each
# takes about 1.5 s.
[[profile.default.overrides]]
filter = 'binary(doctor) & (test(=doctor_does_not_wait_for_a_descendant_holding_protocol_output_open) | test(=doctor_finds_the_real_binary_that_sh_resolves) | test(=doctor_prints_brew_upgrade_only_for_a_cellar_binary))'
threads-required = 'num-test-threads'

# The TypeScript replays run jscpd through npx under the hook's 10 s timeout. In the
# container gate the run's opening disk flood made two duplication replays time out
# and come back empty; alone the test takes about 11 s.
[[profile.default.overrides]]
filter = 'binary(golden_quality) & test(=ts_quality_replays_every_golden_case)'
threads-required = 'num-test-threads'

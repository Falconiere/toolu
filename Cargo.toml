# The toolu Rust workspace (epic #402). Members are listed one by one: the glob
# `crates/*` would also match `crates/core`, which is not a package, and
# `exclude = ["crates/core"]` would drop every core crate with it.
# `cargo xtask check-layers` fails when a crate directory is not listed here.
[workspace]
resolver = "3"
# Vendored third-party code is built as a dependency, never as a member.
exclude = ["vendor/tree-sitter-bash"]
members = [
  "crates/core/protocol",
  "crates/core/runtime",
  "crates/core/shell",
  "crates/core/http",
  "crates/core/state",
  "crates/core/engine",
  "crates/core/github",
  "crates/core/jev",
  "crates/http-test-support",
  "crates/cli",
  "crates/xtask",
  "crates/toolu",
  "crates/ts-quality",
  "crates/python-quality",
  "crates/rust-quality",
  "crates/ast-grep",
  "crates/brainstorm",
  "crates/delivery-flow",
  "crates/toolu-review",
  "crates/jev",
  "crates/statusline",
  "crates/pr-babysit",
  "crates/epic-orchestrator",
]

# The lockstep version: release-please bumps it with package.json and every plugin.json.
[workspace.package]
version = "8.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
# Black-box tests of the `toolu` binary (#442).
assert_cmd = "2"
# The `toolu` command tree (#442): the builder API only, without derive's
# proc-macro dependencies or colour's anstream stack.
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# The `toolu commands --json` snapshot and its schema validation (#442).
insta = { version = "1", default-features = false }
# The schema tests use 0.33 because 0.58 pulls getrandom 0.3 alongside ring's
# 0.2; cargo-deny rejects that duplicate. Contract tests exercise validator_for.
jsonschema = { version = "0.33", default-features = false }
# getrusage for `cargo xtask measure`, and killpg for toolu-runtime's process groups (#414),
# without unsafe in the workspace.
nix = { version = "0.31", default-features = false, features = ["resource", "signal"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }
tempfile = "3"
toml = "1"
url = { version = "2", default-features = false }
# The shell parser (#416): only toolu-shell links tree-sitter-bash (rules.json `shell-parser`).
# 0.24 is the last tree-sitter without a serde_json/preserve_order build dependency, which
# pulls the Zlib foldhash into the graph; brush-parser fails deny.toml too (docs/shell-analysis.md).
# tree-sitter-bash is vendored with the 0.25.1 fix to its heredoc serializer (vendor/).
tree-sitter = "0.24"
tree-sitter-bash = { path = "vendor/tree-sitter-bash", version = "0.23.3" }

# The quality bar (#455): gate data. A change here is its own `chore(gates):` PR
# (`cargo xtask check-gate-change`); the reasons are in docs/rust-quality-bar.md.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Size and complexity (rules 2 and 4); thresholds in clippy.toml.
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
# No panicking paths outside tests (rule 18).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
# Leftovers and capability boundaries (rules 14 and 19).
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# No mod.rs (rule 11).
mod_module_files = "deny"
# Casts, clones and pass-by-value, after toolu-ghrunner.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
checked_conversions = "deny"
lossy_float_literal = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
implicit_clone = "deny"
cloned_instead_of_copied = "deny"
str_to_string = "deny"
needless_pass_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
unnecessary_wraps = "deny"
result_large_err = "deny"
map_err_ignore = "deny"
manual_let_else = "deny"
single_match_else = "deny"
wildcard_enum_match_arm = "deny"
verbose_file_reads = "deny"
flat_map_option = "deny"
# The kit's two relaxations of the noisiest pedantic lints, for every crate.
module_name_repetitions = "allow"
must_use_candidate = "allow"

# tree-sitter's C parser (#416) at -O0 is many times slower, and toolu-shell's
# parse budget is wall clock, so debug builds and tests compile it optimized.
[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-bash]
opt-level = 3

# Hooks wrap their main in catch_unwind (#413), so panics must unwind.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

name: Tests

on:
  # No workflow-level path filters (#458): GitHub leaves a required check from a
  # path-skipped workflow Pending. The `changes` job decides instead, and a job
  # skipped by its `if` reports Success. Groups live in .github/ci-paths.json.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs are wasted minutes: pushing twice in quick succession left the
# first Tests run grinding to completion while the second did the same work.
# toolu-review.yml already cancels; this matches it — except on main, where each
# commit keeps its own result rather than being cancelled by the next.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Classifies the event's diff into the path groups of .github/ci-paths.json and
  # outputs one boolean per group. pull_request: base...head; push: before..after;
  # workflow_dispatch, an unmatched path, .github/**, bun.lock, an empty diff or
  # a diff error: every group on. A release-please version bump: every group off.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.groups.outputs.ts }}
      opencode: ${{ steps.groups.outputs.opencode }}
      docs: ${{ steps.groups.outputs.docs }}
      rust: ${{ steps.groups.outputs.rust }}
      ports: ${{ steps.groups.outputs.ports }}
      changed: ${{ steps.groups.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Classify the changed paths
        id: groups
        run: bun run tooling/src/ci-changes.ts

  ts:
    name: bun run test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The suites exercise real host and analysis tools.
      - name: Install test tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      # The guardrails pattern checks and the retrieval benchmark drive real ast-grep.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      # cargo xtask check-markdown-cli (#444) judges every skill, command, agent
      # and doc against the toolu command tree; test:ts runs it.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript quality gate
        # This Ubuntu runner records the measured cold-start delta in its log
        # and GITHUB_STEP_SUMMARY. The 5 ms cold-start budget is report-only on
        # Linux; bench:shell --assert still fails for all bundle-size and parser
        # p99 budgets. macOS Apple Silicon and TOOLU_LATENCY_ENFORCE=1 enforce
        # the 5 ms budget as a hard assertion.
        env:
          TOOLU_LATENCY_ENFORCE: "0"
        run: |
          set -euo pipefail
          # Local `bun run test` delegates here. Includes format, lint, typecheck,
          # guardrails, unit and conformance, bundle/launcher drift, context and
          # latency measurement, hard size/parser budgets, and deterministic
          # benchmarks. bench:shell appends its measured table to the job summary.
          bun run test:ts

  # Real OpenCode acceptance (#362): the pinned opencode-ai host runs every
  # catalog plugin's checks in isolated profiles against a scripted loopback
  # model, on both declared platforms. A missing host, tool or Chromium fails
  # the run; nothing is skipped. The report is uploaded even on failure.
  opencode:
    name: opencode (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.opencode == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install jq
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      # ast-grep backs the ast-grep plugin's checks.
      - name: Install acceptance tools
        run: |
          set -euo pipefail
          npm install -g @ast-grep/cli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pinned CLI and the host's package caches; the run still checks the
      # cached binary's version against tools/toolu-opencode/contract/pin.json.
      - name: Cache the pinned OpenCode host
        uses: actions/cache@v4
        with:
          path: ~/.cache/toolu/opencode-host
          key: opencode-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/toolu-opencode/contract/pin.json') }}

      - name: OpenCode acceptance
        run: bun run test:opencode --report "$RUNNER_TEMP/opencode-acceptance.json"

      - name: Upload the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/opencode-acceptance.json
          if-no-files-found: warn

  # The documentation checks a docs-only change needs, without the whole gate:
  # the doc-reading checks and tests that `test:ts` also runs (`test:docs`).
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The guardrails pattern checks drive real ast-grep.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      # cargo xtask check-markdown-cli (#444) judges every skill, command, agent
      # and doc against the toolu command tree; test:docs runs it.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Documentation checks
        run: bun run test:docs

  # The Rust workspace gate (#407): format, clippy with warnings denied, build,
  # tests and the layer graph, on both declared platforms. The toolchain comes
  # from rust-toolchain.toml; --locked keeps Cargo.lock authoritative.
  rust:
    name: ${{ matrix.check }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: rust
          - os: macos-14
            check: rust-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # check-gate-change diffs against the merge base.
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the gate's cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-llvm-cov@0.9.1,cargo-nextest@0.9.146

      # jscpd (a devDependency) and the rust-quality step run on Bun.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The rust-quality step runs the plugin's ast-grep rules and fails closed without it.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Test native release helper
        if: matrix.os == 'ubuntu-latest'
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Reject Rust suppressions and structural violations
        if: matrix.os == 'ubuntu-latest'
        run: cargo xtask gate --only guardrails

      - name: Check Rust crate layers
        if: matrix.os == 'ubuntu-latest'
        run: cargo xtask gate --only layers

      # The quality bar (#455): format, clippy, guardrails, layers, reach, deny,
      # machete, unused-pub, hooks, docs-cli, cli-compat, jscpd, rust-quality, tests,
      # coverage, docs, and
      # check-gate-change against the PR base (or the pushed range).
      - name: cargo xtask gate
        if: matrix.os == 'ubuntu-latest'
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GATE_BASE" = "0000000000000000000000000000000000000000" ]; then GATE_BASE=; fi
          cargo xtask gate ${GATE_BASE:+--base "$GATE_BASE"} ${PR_TITLE:+--title "$PR_TITLE"}

      - name: macOS clippy and Rust tests
        if: matrix.os == 'macos-14'
        run: cargo xtask gate --only clippy --only tests

      # Shell analysis latency (#416): parse and walk p99 within 0.1 ms over the
      # real fixture commands, measured on a release build.
      - name: Shell analysis latency
        run: cargo test --release --locked -p toolu-shell --test latency -- --nocapture

      # The native hook launcher (#412) finds a toolu installed at Homebrew's bin
      # and at the installer's /usr/local/bin, under a PATH that lacks both.
      - name: Launcher end to end
        run: |
          set -euo pipefail
          cargo build --release -p toolu-cli --locked
          if [ "$RUNNER_OS" = macOS ]; then brew_bin=/opt/homebrew/bin; else brew_bin=/home/linuxbrew/.linuxbrew/bin; fi
          for dir in "$brew_bin" /usr/local/bin; do
            sudo mkdir -p "$dir"
            sudo install -m 0755 target/release/toolu "$dir/toolu"
            status=0
            cargo xtask launcher-e2e --bin "$dir/toolu" || status=$?
            sudo rm -f "$dir/toolu"
            [ "$status" -eq 0 ] || exit "$status"
          done

      # The `toolu --version` startup budget (#442, docs/resource-budgets.md) on
      # the release binary the previous step built. Linux gates; macOS is not gated.
      - name: toolu --version startup budget
        if: runner.os == 'Linux'
        run: cargo xtask check-startup --bin target/release/toolu

  # Static Linux builds (#411) from the first Rust PR, not first at release
  # time: a release build per musl target, and the binary must be static.
  rust-musl:
    name: rust-musl (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain and the musl target
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # toolu-shell compiles tree-sitter's C sources (#416) with musl-gcc, which
      # cc-rs would not pick for aarch64 on its own.
      - name: Install musl C toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - name: Release build
        run: cargo build --workspace --release --locked --target "${{ matrix.target }}"

      - name: Require a static binary
        run: |
          set -euo pipefail
          info="$(file "target/${{ matrix.target }}/release/toolu")"
          echo "$info"
          # file(1) says "static-pie linked" (x86_64) or "statically linked" (aarch64).
          echo "$info" | grep -Eq '(static-pie|statically) linked'

  # Fuzzing (#416): both toolu-shell fuzz targets for a bounded time on every
  # change; fuzz.yml runs them longer on a schedule. cargo-fuzz needs nightly
  # (crates/core/shell/fuzz/rust-toolchain.toml), and clang instruments
  # tree-sitter's C sources so libFuzzer and AddressSanitizer reach them too.
  fuzz:
    name: fuzz
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/core/shell/fuzz
    env:
      CC: clang
      CFLAGS: -fsanitize=fuzzer-no-link,address
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      # The workspace lock pins every shared dependency of the fuzz package.
      - name: Seed the corpora from the shell fixtures
        run: |
          set -euo pipefail
          cp ../../../../Cargo.lock .
          for target in analyze nested; do
            python3 -c 'import json, os, sys; d = sys.argv[1]; os.makedirs(d, exist_ok=True); [open(os.path.join(d, "seed-%03d" % i), "w").write(c["input"]) for i, c in enumerate(json.load(open("../../../../fixtures/shell/unbash-baseline.json"))["cases"])]' "corpus/$target"
          done

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core/shell/fuzz -> target

      - name: Fuzz analyze for 60 seconds
        run: cargo fuzz run analyze -- -max_total_time=60 -timeout=10 -rss_limit_mb=4096

      - name: Fuzz nested for 60 seconds
        run: cargo fuzz run nested -- -max_total_time=60 -timeout=10 -rss_limit_mb=4096

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/core/shell/fuzz/artifacts

  # The Rust conformance leg (#409): the black-box suites against the Rust
  # binary for each hook entry in fixtures/rust-ported.json, the one list that
  # grows with every port. An empty list is a no-op, so no toolchain is set up.
  rust-conformance:
    name: rust-conformance
    needs: changes
    if: needs.changes.outputs.ports == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Count the ported entries
        id: ports
        run: echo "count=$(jq '.entries | length' fixtures/rust-ported.json)" >> "$GITHUB_OUTPUT"

      - name: Install test tools
        if: steps.ports.outputs.count != '0'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq
          npm install -g @openai/codex @ast-grep/cli

      - name: Install the pinned toolchain
        if: steps.ports.outputs.count != '0'
        run: rustup toolchain install

      - name: Cache cargo
        if: steps.ports.outputs.count != '0'
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust conformance
        run: bun run test:rust-conformance

  # Hook resource benchmark (#410): every hook entry's max RSS, CPU (children
  # included) and wall per spawn, measured by `cargo xtask measure`. Linux
  # asserts the entries in fixtures/rust-ported.json against
  # benchmarks/hook-budgets.json; macOS reports only. Each leg uploads its
  # `toolu.hook-resources/v1` result, the source of the committed baselines.
  hook-bench:
    name: hook-bench (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.ports == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the measurer and any ported entries
        run: |
          set -euo pipefail
          cargo build --release --locked -p xtask
          if [ "$(jq '.entries | length' fixtures/rust-ported.json)" != "0" ]; then
            cargo build --release --locked --bin toolu
          fi

      - name: Bench end-to-end tests
        run: bun test --timeout 180000 tooling/src/benchmarks/__tests__/hook-resources.native.test.ts

      - name: bench:hooks
        env:
          RESULT: ${{ runner.temp }}/hook-resources.json
        run: |
          set -euo pipefail
          assert=
          if [ "$RUNNER_OS" = "Linux" ]; then assert=--assert; fi
          bun run bench:hooks --out "$RESULT" $assert | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-resources-${{ matrix.os }}
          path: ${{ runner.temp }}/hook-resources.json
          if-no-files-found: warn

  # The new aggregate status. `if: always()` keeps it from being skipped (a skipped
  # required check would count as passing). It fails when `changes` failed, a
  # needed job failed or was cancelled, or a job was skipped although its group
  # was on; it passes when each job succeeded or was skipped with its group off.
  gate:
    name: gate
    needs: [changes, ts, opencode, docs, rust, rust-musl, fuzz, rust-conformance, hook-bench]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bun run tooling/src/ci-aggregate.ts tests.yml

  # Branch protection currently requires `typescript`. Keep it equivalent to
  # `gate` until the repository setting is migrated to the new check name.
  typescript:
    name: typescript
    needs: [changes, ts, opencode, docs, rust, rust-musl, fuzz, rust-conformance, hook-bench]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Require every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bun run tooling/src/ci-aggregate.ts tests.yml

name: Tests

on:
  push:
    branches: [main]
    # GitHub skips the workflow only when every changed file matches this list.
    # A release-please bump is exactly these files (root + workspace package.json
    # version lines + plugin manifests). Any other path still runs
    # the suite, including a release-please branch that also touches code.
    # hooks/dist/** is deliberately absent: a bundle-only change still tests.
    # Branch name and commit author are not consulted: both can be forged.
    # workflow_dispatch ignores path filters, so a manual run always tests.
    # Release Please itself still runs on the merge so the tag publishes.
    paths-ignore: &release-only
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "package.json"
      - "packages/*/package.json"
      - "tools/*/package.json"
      - "plugins/*/.claude-plugin/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"
  pull_request:
    branches: [main]
    paths-ignore: *release-only
  workflow_dispatch:

# Superseded runs are wasted minutes: pushing twice in quick succession left the
# first Tests run grinding to completion while the second did the same work.
# toolu-review.yml already cancels; this matches it — except on main, where each
# commit keeps its own result rather than being cancelled by the next.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y shellcheck

      - name: Shellcheck (standalone scripts + assembled concern modules)
        run: bun run lint:shell

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The Bun suites still compare with legacy scripts and tools before #279
      # removes them. Install each real tool: a skipped suite is untested code.
      - name: Install test tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y bats jq shellcheck parallel

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      # The guardrails pattern checks and the retrieval benchmark drive real ast-grep.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript quality gate
        # This Ubuntu runner records the measured cold-start delta in its log
        # and GITHUB_STEP_SUMMARY. The 5 ms cold-start budget is report-only on
        # Linux; bench:shell --assert still fails for all bundle-size and parser
        # p99 budgets. macOS Apple Silicon and TOOLU_LATENCY_ENFORCE=1 enforce
        # the 5 ms budget as a hard assertion.
        env:
          TOOLU_LATENCY_ENFORCE: "0"
        run: |
          set -euo pipefail
          # Local `bun run test` delegates here. Includes format, lint, typecheck,
          # guardrails, unit and conformance, bundle/launcher drift, context and
          # latency measurement, hard size/parser budgets, and deterministic
          # benchmarks. bench:shell appends its measured table to the job summary.
          bun run test:ts

  bats:
    name: bats (plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y bats jq parallel

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Confirm tooling
        run: |
          bats --version
          jq --version
          ast-grep --version
          codex --version
          python3 --version
          bun --version
          bunx oxlint --version

      - name: Enforce colocated __tests__ layout
        run: |
          set -euo pipefail
          # Every .bats suite must live in a colocated __tests__/ dir next to the
          # code it exercises. Fail the build (with the offending paths) if any
          # test file sits outside a __tests__ directory.
          stray=$(find plugins benchmarks tooling packages tools -name "*.bats" -not -path "*/__tests__/*" 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "Test files outside a __tests__/ dir:" >&2
            echo "$stray" >&2
            echo "Move each into a colocated __tests__/ folder." >&2
            exit 1
          fi

      - name: Run bats suite
        run: |
          set -euo pipefail
          # Run every bats suite in every plugin (hook and skill tests live under
          # their owning plugin; discovery is dynamic, so new plugins are picked
          # up automatically). The benchmarks harness is bun-tested since #277. Skill tests that wrap a
          # REST API stub curl on PATH, so they never hit real APIs.
          #
          # Through tooling/bats-run.sh so CI runs the suite the same way a
          # developer does, and gets the same parallelism: files in parallel,
          # tests within a file serial. It owns discovery and the
          # nothing-found guard. Roots include packages/ and tools/ so new
          # workspace Bats cannot be silently skipped (#208).
          bash tooling/bats-run.sh plugins tooling packages tools

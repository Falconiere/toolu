name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs are wasted minutes: pushing twice in quick succession left the
# first Tests run grinding to completion while the second did the same work.
# toolu-review.yml already cancels; this matches it — except on main, where each
# commit keeps its own result rather than being cancelled by the next.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# A release commit only bumps versions and CHANGELOG. The commits it packages
# were already tested when they landed on main, and the Release PR is that same
# diff. Running this suite on the Release PR and again on the merge only burns
# minutes. Skip those two cases. Any other push, pull request, or manual run
# still tests. Release Please itself still runs on the merge so the tag publishes.
jobs:
  shellcheck:
    name: shellcheck
    if: "${{ !startsWith(github.head_ref || '', 'release-please--') && !(startsWith(github.event.head_commit.message || '', 'chore(main): release ') && (github.event.head_commit.author.email || '') == '41898282+github-actions[bot]@users.noreply.github.com') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y shellcheck

      - name: Shellcheck (standalone scripts + assembled concern modules)
        run: bun run lint:shell

  bats:
    name: bats (plugins)
    if: "${{ !startsWith(github.head_ref || '', 'release-please--') && !(startsWith(github.event.head_commit.message || '', 'chore(main): release ') && (github.event.head_commit.author.email || '') == '41898282+github-actions[bot]@users.noreply.github.com') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y bats jq parallel

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Confirm tooling
        run: |
          bats --version
          jq --version
          ast-grep --version
          codex --version
          python3 --version
          bun --version

      - name: Enforce colocated __tests__ layout
        run: |
          set -euo pipefail
          # Every .bats suite must live in a colocated __tests__/ dir next to the
          # code it exercises. Fail the build (with the offending paths) if any
          # test file sits outside a __tests__ directory.
          stray=$(find plugins benchmarks tooling -name "*.bats" -not -path "*/__tests__/*" || true)
          if [ -n "$stray" ]; then
            echo "Test files outside a __tests__/ dir:" >&2
            echo "$stray" >&2
            echo "Move each into a colocated __tests__/ folder." >&2
            exit 1
          fi

      - name: Run bats suite
        run: |
          set -euo pipefail
          # Run every bats suite in every plugin AND the benchmarks harness (hook
          # and skill tests live under their owning plugin; discovery is dynamic,
          # so new plugins are picked up automatically). Skill tests that wrap a
          # REST API stub curl on PATH, so they never hit real APIs.
          #
          # Through tooling/bats-run.sh so CI runs the suite the same way a
          # developer does, and gets the same parallelism: files in parallel,
          # tests within a file serial. It owns discovery and the
          # nothing-found guard.
          bash tooling/bats-run.sh plugins benchmarks tooling

      - name: Deterministic benchmarks (hermetic)
        run: |
          set -euo pipefail
          # Regenerate + validate the deterministic retrieval benchmark. No API
          # key in CI, so token counting is the offline heuristic — fully
          # hermetic. Guards the harness against regressions; the live tier
          # (whole-session) is run manually, never in CI.
          bash benchmarks/run.sh --tier deterministic
          f=$(ls benchmarks/results/retrieval-deterministic-*.json | tail -1)
          bash benchmarks/run.sh --validate "$f"

      - name: Context budget guard
        run: |
          set -euo pipefail
          # Cap the harness's own injected-context footprint: word ceilings on the
          # Session Protocol + per-language docs and on every skill `description`.
          # Fails the build if any surface exceeds budget or drops a required
          # trigger phrase, so the baseline cannot silently regrow.
          bash plugins/toolu/scripts/context-budget.sh

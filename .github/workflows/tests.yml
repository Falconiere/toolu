name: Tests

on:
  # No workflow-level path filters (#458): GitHub leaves a required check from a
  # path-skipped workflow Pending. The `changes` job decides instead, and a job
  # skipped by its `if` reports Success. Groups live in .github/ci-paths.json.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs are wasted minutes: pushing twice in quick succession left the
# first Tests run grinding to completion while the second did the same work.
# toolu-review.yml already cancels; this matches it — except on main, where each
# commit keeps its own result rather than being cancelled by the next.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Classifies the event's diff into the path groups of .github/ci-paths.json and
  # outputs one boolean per group. pull_request: base...head; push: before..after;
  # workflow_dispatch, an unmatched path, .github/**, bun.lock, an empty diff or
  # a diff error: every group on. A release-please version bump: every group off.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.groups.outputs.ts }}
      opencode: ${{ steps.groups.outputs.opencode }}
      docs: ${{ steps.groups.outputs.docs }}
      rust: ${{ steps.groups.outputs.rust }}
      ports: ${{ steps.groups.outputs.ports }}
      changed: ${{ steps.groups.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Classify the changed paths
        id: groups
        run: bun run tooling/src/ci-changes.ts

  gate:
    name: bun run test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The suites exercise real host and analysis tools.
      - name: Install test tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      # The guardrails pattern checks and the retrieval benchmark drive real ast-grep.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript quality gate
        # This Ubuntu runner records the measured cold-start delta in its log
        # and GITHUB_STEP_SUMMARY. The 5 ms cold-start budget is report-only on
        # Linux; bench:shell --assert still fails for all bundle-size and parser
        # p99 budgets. macOS Apple Silicon and TOOLU_LATENCY_ENFORCE=1 enforce
        # the 5 ms budget as a hard assertion.
        env:
          TOOLU_LATENCY_ENFORCE: "0"
        run: |
          set -euo pipefail
          # Local `bun run test` delegates here. Includes format, lint, typecheck,
          # guardrails, unit and conformance, bundle/launcher drift, context and
          # latency measurement, hard size/parser budgets, and deterministic
          # benchmarks. bench:shell appends its measured table to the job summary.
          bun run test:ts

  # Real OpenCode acceptance (#362): the pinned opencode-ai host runs every
  # catalog plugin's checks in isolated profiles against a scripted loopback
  # model, on both declared platforms. A missing host, tool or Chromium fails
  # the run; nothing is skipped. The report is uploaded even on failure.
  opencode:
    name: opencode (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.opencode == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install jq
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      # ast-grep backs the ast-grep plugin's checks; agent-browser and its
      # Chromium back the browser workflow check.
      - name: Install acceptance tools
        run: |
          set -euo pipefail
          npm install -g @ast-grep/cli agent-browser@0.38.2
          if [ "$RUNNER_OS" = "Linux" ]; then agent-browser install --with-deps; else agent-browser install; fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pinned CLI and the host's package caches; the run still checks the
      # cached binary's version against tools/toolu-opencode/contract/pin.json.
      - name: Cache the pinned OpenCode host
        uses: actions/cache@v4
        with:
          path: ~/.cache/toolu/opencode-host
          key: opencode-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/toolu-opencode/contract/pin.json') }}

      - name: OpenCode acceptance
        run: bun run test:opencode --report "$RUNNER_TEMP/opencode-acceptance.json"

      - name: Upload the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/opencode-acceptance.json
          if-no-files-found: warn

  # The documentation checks a docs-only change needs, without the whole gate:
  # the doc-reading checks and tests that `test:ts` also runs (`test:docs`).
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The guardrails pattern checks drive real ast-grep.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Documentation checks
        run: bun run test:docs

  # The Rust workspace gate (#407): format, clippy with warnings denied, build,
  # tests and the layer graph, on both declared platforms. The toolchain comes
  # from rust-toolchain.toml; --locked keeps Cargo.lock authoritative.
  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo xtask check-layers
        run: cargo xtask check-layers

  # Static Linux builds (#411) from the first Rust PR, not first at release
  # time: a release build per musl target, and the binary must be static.
  rust-musl:
    name: rust-musl (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain and the musl target
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Release build
        run: cargo build --workspace --release --locked --target "${{ matrix.target }}"

      - name: Require a static binary
        run: |
          set -euo pipefail
          info="$(file "target/${{ matrix.target }}/release/xtask")"
          echo "$info"
          # file(1) says "static-pie linked" (x86_64) or "statically linked" (aarch64).
          echo "$info" | grep -Eq '(static-pie|statically) linked'

  # The Rust conformance leg (#409): the black-box suites against the Rust
  # binary for each hook entry in fixtures/rust-ported.json, the one list that
  # grows with every port. An empty list is a no-op, so no toolchain is set up.
  rust-conformance:
    name: rust-conformance
    needs: changes
    if: needs.changes.outputs.ports == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Count the ported entries
        id: ports
        run: echo "count=$(jq '.entries | length' fixtures/rust-ported.json)" >> "$GITHUB_OUTPUT"

      - name: Install test tools
        if: steps.ports.outputs.count != '0'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq
          npm install -g @openai/codex @ast-grep/cli

      - name: Install the pinned toolchain
        if: steps.ports.outputs.count != '0'
        run: rustup toolchain install

      - name: Cache cargo
        if: steps.ports.outputs.count != '0'
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust conformance
        run: bun run test:rust-conformance

  # The required status. Branch protection requires `typescript`; this job
  # carries that name. `if: always()` keeps it from being skipped (a skipped
  # required check would count as passing). It fails when `changes` failed, a
  # needed job failed or was cancelled, or a job was skipped although its group
  # was on; it passes when each job succeeded or was skipped with its group off.
  typescript:
    name: typescript
    needs: [changes, gate, opencode, docs, rust, rust-musl, rust-conformance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bun run tooling/src/ci-aggregate.ts tests.yml

name: Release Please

# Conventional commits merged to main accumulate into a single batched Release PR
# (release-please manifest mode). Merging that PR bumps the touched plugins'
# versions + changelogs and creates the GitHub Release(s). See the "Releases"
# section of README.md for the contributor-facing flow.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs (validation / re-trigger if a push event is missed)

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }} # default token; tests.yml does NOT run on the Release PR (accepted)

      # release-please cannot update a file above a component dir (extra-files
      # paths can't escape the package, by design), so the root package.json
      # mirror of the toolu version is synced here once the merged manifest
      # diverges from it. Non-fatal: package.json's version is informational
      # (nothing publishes it), so a failed sync must never fail the release.
      - name: Sync root package.json to toolu version
        run: |
          set -uo pipefail
          TOOLU="$(jq -r '."plugins/toolu"' .release-please-manifest.json)"
          CUR="$(jq -r '.version' package.json)"
          if ! printf '%s' "$TOOLU" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::package.json sync skipped: toolu version '$TOOLU' is not strict semver"
            exit 0
          fi
          if [ "$TOOLU" = "$CUR" ]; then
            echo "package.json already in sync ($CUR)"
            exit 0
          fi
          echo "syncing root package.json $CUR -> $TOOLU"
          tmp="$(mktemp)"
          if ! jq --arg v "$TOOLU" '.version = $v' package.json > "$tmp"; then
            echo "::warning::package.json sync skipped: jq rewrite failed"
            exit 0
          fi
          if ! mv "$tmp" package.json; then
            echo "::warning::package.json sync skipped: could not replace package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: sync root package.json to $TOOLU [skip ci]" || {
            echo "::warning::package.json sync skipped: nothing to commit"
            exit 0
          }
          git push || echo "::warning::package.json sync push failed (branch protection?); version left unsynced"

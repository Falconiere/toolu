name: Release Please

# Conventional commits merged to main accumulate into a single batched Release PR
# (release-please manifest mode, whole-repo single version). Merging that PR bumps
# the repo version in package.json, Cargo and every plugin.json, updates the
# CHANGELOG, tags vX.Y.Z, and creates a draft GitHub Release. Native finalization
# publishes it after npm and platform checks. See the "Releases"
# section of README.md for the contributor-facing flow.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs (validation / re-trigger if a push event is missed)

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / draft
    if: vars.TOOLU_RELEASE_DISABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The action reads config/manifest and edits files via the GitHub API,
      # but checkout is the standard release-please-action pattern and a cheap
      # safety net on the release critical path — keep it.
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Release PR, the tag and the draft Release are created under the
      # "Toolu - Release" GitHub App, not the default GITHUB_TOKEN. GitHub starts
      # no workflow run from an event the built-in token raised, so under it the
      # Release PR never got CI; an App installation token is a distinct
      # identity, so the PR's checks run and the tag push is a real event. The
      # mint also checks the App's installation on this repo — a missing install
      # fails here, loudly, before anything is released.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TOOLU_RELEASE_APP_ID }}
          private-key: ${{ secrets.TOOLU_RELEASE_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # Publishing is chained here rather than triggered by `release: published`.
  # The draft Release is created under the release App (above), so a `release:`
  # event would now fire — chaining is kept on purpose: one run cuts the tag and
  # publishes, so one failure is one red run, and the publish jobs below need
  # nothing beyond the default token.
  #
  # The npm package ships the native binaries, so the binaries come first:
  # `publish` waits for `native`, which publishes the release, and embeds its
  # archives. The native release never depends on npm. npm still makes a
  # version visible minutes after accepting it with no published bound: 8.1.1
  # waited 8 minutes 11 seconds, outlived the npm job's wait, and the native
  # release and Homebrew tap were skipped although npm had shipped.
  # npm-publish.yml verifies the registry in its own job, which nothing here
  # waits for.
  publish:
    name: Publish to npm
    needs: [release-please, native]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  native:
    name: Build native toolu release
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    uses: ./.github/workflows/release-native.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      publish: true
    secrets:
      TOOLU_MINISIGN_SECRET_KEY: ${{ secrets.TOOLU_MINISIGN_SECRET_KEY }}

  # Stable tags only: release-homebrew.yml skips a tag that contains '-'.
  homebrew:
    name: Update Homebrew tap
    needs: [release-please, native]
    if: needs.release-please.outputs.releases_created == 'true' && needs.native.result == 'success' && needs.release-please.outputs.tag_name != ''
    permissions:
      contents: read
    uses: ./.github/workflows/release-homebrew.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      HOMEBREW_APP_ID: ${{ secrets.HOMEBREW_APP_ID }}
      HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}

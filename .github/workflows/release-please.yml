name: Release Please

# Conventional commits merged to main accumulate into a single batched Release PR
# (release-please manifest mode, whole-repo single version). Merging that PR bumps
# the repo version in package.json + every plugin's plugin.json, updates the
# CHANGELOG, tags vX.Y.Z, and publishes the GitHub Release. See the "Releases"
# section of README.md for the contributor-facing flow.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs (validation / re-trigger if a push event is missed)

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The action reads config/manifest and edits files via the GitHub API,
      # but checkout is the standard release-please-action pattern and a cheap
      # safety net on the release critical path — keep it.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }} # default token; tests.yml does NOT run on the Release PR (accepted)

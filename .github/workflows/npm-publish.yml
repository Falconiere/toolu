name: npm publish

# Publishes the npm packages for a released tag.
#
# Called by release-please.yml in the same run that cuts the release, and
# separately runnable from the Actions tab to retry a tag.
#
# It is NOT triggered by `release: published`. release-please creates the Release
# with the default GITHUB_TOKEN, and GitHub does not start a workflow run from an
# event created by that token -- a `release:` trigger here is silently ignored,
# which is exactly how the 6.7.0 release published nothing.
#
# Three packages publish, in dependency order: @toolu/core, then
# @toolu/opencode which depends on it, then the unscoped `toolu` CLI.
# @toolu/conformance stays private — it is an internal test harness.
#
# @toolu/opencode carries the bash plugins/ tree, staged by its prepack, so an
# `opencode plugin add @toolu/opencode` needs no clone and no TOOLU_REPO_ROOT.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    name: publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Node and npm pins match Falconiere/toolu-conventions, which already
      # publishes @toolu/create with this same NPM_TOKEN. Provenance needs
      # npm >= 11.5.1, and setup-node ships whatever npm Node bundles, which
      # is older.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: Set up an npm new enough to attest provenance
        run: npm install --global npm@11.5.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches every package version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          for dir in packages/toolu-core tools/toolu-opencode tools/toolu-cli; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$dir is private at $tag; skipping"
              continue
            fi
            pkg=$(node -p "require('./$dir/package.json').version")
            if [ "v$pkg" != "$tag" ]; then
              echo "tag $tag does not match $dir version $pkg" >&2
              exit 1
            fi
          done
          echo "publishing $tag"

      # Dependency order: @toolu/opencode depends on @toolu/core, and Bun rewrites
      # its workspace:* to that exact version at pack time, so core must land first.
      # Publishing is idempotent per package: a version already on the registry is
      # skipped, so a re-run after a partial failure resumes rather than aborting.
      - name: Publish
        run: |
          set -uo pipefail
          status=0
          for dir in packages/toolu-core tools/toolu-opencode tools/toolu-cli; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$dir is private at $tag; skipping"
              continue
            fi
            name=$(node -p "require('./$dir/package.json').name")
            pkg=$(node -p "require('./$dir/package.json').version")
            if out=$(npm view "$name@$pkg" version 2>&1); then
              echo "$name@$pkg is already published ($out); skipping"
              continue
            elif ! printf '%s' "$out" | grep -q 'E404'; then
              echo "npm view failed for $name for a reason other than the version being absent:" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            echo "publishing $name@$pkg"
            ( cd "$dir" && npm publish --provenance --access public ) || status=1
          done
          exit "$status"
        env:
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: npm publish

# Publishes the npm packages for a released tag.
#
# Called by release-please.yml in the same run that cuts the release, and
# separately runnable from the Actions tab to retry a tag.
#
# It is NOT triggered by `release: published`. release-please creates the draft Release
# with the default GITHUB_TOKEN, and GitHub does not start a workflow run from an
# event created by that token -- a `release:` trigger here is silently ignored,
# which is exactly how the 6.7.0 release published nothing.
#
# One package publishes: @toolu/plugins, the `toolu-plugins` wrapper that runs
# the native `toolu plugins`. @toolu/core is no longer published (#440); its last
# version stays on the registry, deprecated.
#
# @toolu/plugins publishes from tools/toolu-cli/npm, not from its private dev
# workspace. npx checks the local project tree before the registry, so a
# workspace under the published name made `npx @toolu/cli` (the old name) fail
# with "toolu: command not found" from every toolu checkout.
#
# npm acknowledges a publish minutes before the package is fetchable. The first
# ever CLI package, @toolu/cli 6.8.1, answered 404 for about six minutes after
# "+ @toolu/cli@6.8.1", so npx failed right after the release went green, and
# @toolu/plugins 8.1.1 took 8 minutes 11 seconds after npm reported it "being
# processed", one second past the old 8-minute window. The
# last step polls until every package resolves, so green means installable and
# a re-run after green skips instead of publishing twice. A prerelease uses the
# npm `next` dist-tag so it does not move stable `latest`.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    name: publish npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Node and npm pins match Falconiere/toolu-conventions, which already
      # publishes @toolu/create with this same NPM_TOKEN. Provenance needs
      # npm >= 11.5.1, and setup-node ships whatever npm Node bundles, which
      # is older.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: Set up an npm new enough to attest provenance
        run: npm install --global npm@11.5.1

      - name: Check the tag matches every package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          for dir in tools/toolu-cli/npm; do
            if [ ! -f "$dir/package.json" ]; then
              echo "$dir/package.json not found at $tag" >&2
              exit 1
            fi
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$dir is private at $tag; skipping"
              continue
            fi
            pkg=$(node -p "require('./$dir/package.json').version")
            if [ "v$pkg" != "$tag" ]; then
              echo "tag $tag does not match $dir version $pkg" >&2
              exit 1
            fi
          done
          echo "publishing $tag"

      # A failure ABORTS rather than continuing, so one run never publishes a
      # partial set past a failure. Packages already published are skipped, so a
      # re-run resumes from the one that failed.
      - name: Publish
        run: |
          set -uo pipefail
          npm_tag=latest
          if [[ "$TAG" == *-* ]]; then npm_tag=next; fi
          for dir in tools/toolu-cli/npm; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$dir is private at $TAG; skipping"
              continue
            fi
            name=$(node -p "require('./$dir/package.json').name")
            pkg=$(node -p "require('./$dir/package.json').version")
            if out=$(npm view "$name@$pkg" version 2>&1); then
              echo "$name@$pkg is already published ($out); skipping"
              continue
            elif ! printf '%s' "$out" | grep -q 'E404'; then
              echo "npm view failed for $name for a reason other than the version being absent:" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            echo "publishing $name@$pkg"
            if ! ( cd "$dir" && npm publish --provenance --access public --tag "$npm_tag" ); then
              echo "publishing $name@$pkg failed; stopping" >&2
              exit 1
            fi
          done
        env:
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}

      - name: Wait until every package resolves on the registry
        run: |
          set -euo pipefail
          for dir in tools/toolu-cli/npm; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$dir is private; nothing to wait for"
              continue
            fi
            name=$(node -p "require('./$dir/package.json').name")
            pkg=$(node -p "require('./$dir/package.json').version")
            # Each package gets a full window, even when earlier packages
            # take most of theirs to propagate. 20 minutes is more than twice
            # the slowest propagation seen and still ends inside the job's
            # 30-minute timeout, so a stuck publish fails with the message below.
            deadline=$(( $(date +%s) + 20 * 60 ))
            until npm view "$name@$pkg" version >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "$name@$pkg is still not fetchable from the registry: the publish was accepted but has not propagated" >&2
                exit 1
              fi
              echo "$name@$pkg is not fetchable yet; retrying in 15s"
              sleep 15
            done
            echo "$name@$pkg resolves on the registry"
          done
        env:
          # Same .npmrc as the publish step: it reads NODE_AUTH_TOKEN on every npm call.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: npm publish

# Publishes the `toolu` CLI to npm when a GitHub Release is published.
#
# Decoupled from release-please.yml on purpose: that workflow's job is to cut the
# tag and the Release. This one reacts to the Release existing, so a publish can
# be re-run from the Actions tab without re-running the release machinery.
#
# Only tools/toolu-cli publishes today. @toolu/core and @toolu/opencode stay
# private until the OpenCode wiring that consumes them exists — publishing a name
# is permanent, and nothing would be able to use them yet.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish-cli:
    name: publish toolu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Node and npm pins match Falconiere/toolu-conventions, which already
      # publishes @toolu/create with this same NPM_TOKEN. Provenance needs
      # npm >= 11.5.1, and setup-node ships whatever npm Node bundles, which
      # is older.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: Set up an npm new enough to attest provenance
        run: npm install --global npm@11.5.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches the package version
        working-directory: tools/toolu-cli
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$tag" ]; then
            echo "tag $tag does not match tools/toolu-cli version $pkg" >&2
            exit 1
          fi
          echo "publishing toolu@$pkg"

      # `npm view` failing is the expected path for a version that is not yet
      # published, so -e is deliberately off. But a lookup that fails for any
      # OTHER reason -- network, auth, registry outage -- must not be read as
      # "not published": that would turn an unknown into a publish attempt.
      # Only a genuine E404 means absent; anything else fails the job.
      - name: Skip when the version is already on the registry
        id: existing
        working-directory: tools/toolu-cli
        run: |
          set -uo pipefail
          pkg=$(node -p "require('./package.json').version")
          if out=$(npm view "toolu@$pkg" version 2>&1); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "toolu@$pkg is already published ($out); nothing to do"
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "toolu@$pkg is not on the registry yet"
          else
            echo "npm view failed for a reason other than the version being absent:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi

      - name: Publish
        if: steps.existing.outputs.published == 'false'
        working-directory: tools/toolu-cli
        run: npm publish --provenance --access public
        env:
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

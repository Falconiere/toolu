name: npm publish

# Publishes the npm packages for a released tag.
#
# Called by release-please.yml in the same run that cuts the release, and
# separately runnable from the Actions tab to retry a tag.
#
# It is NOT triggered by `release: published`. release-please creates the draft Release
# with the default GITHUB_TOKEN, and GitHub does not start a workflow run from an
# event created by that token -- a `release:` trigger here is silently ignored,
# which is exactly how the 6.7.0 release published nothing.
#
# Two packages publish, both deprecation notices. @toolu/plugins' tarball is
# package.json, README.md, LICENSE, and cli.js. cli.js prints the native
# install commands and exits 69. It ships no binary. @toolu/opencode's tarball
# is package.json, README.md, LICENSE, and index.js, an OpenCode V2 plugin that
# only reports the deprecation; `toolu plugins install --host opencode`
# replaced it. After a stable publish the job marks every version of both
# deprecated. A prerelease still uses the `next`
# dist-tag and does not deprecate, so it cannot move stable `latest`.
# @toolu/core is no longer published (#440); its last
# version stays on the registry, deprecated.
#
# @toolu/plugins publishes from tools/toolu-cli/npm, not from its private dev
# workspace. npx checks the local project tree before the registry, so a
# workspace under the published name made `npx @toolu/cli` (the old name) fail
# with "toolu: command not found" from every toolu checkout.
#
# npm processes a publish asynchronously: `npm publish` returns "Your package is
# being processed and may take a few minutes to become available" and the
# version appears later, with no published upper bound. @toolu/cli 6.8.1 took
# about six minutes; @toolu/plugins 8.1.1 took 8 minutes 11 seconds and failed
# the 8-minute wait this workflow used to run inside its publish job, which
# left the native release and the Homebrew tap unbuilt although npm had
# shipped. So the publish job ends when npm accepts the upload, and the
# `verify` job below polls the registry on its own: nothing waits for it.
# This workflow runs after the native release and the native release never
# depends on this package. A red `verify` means a manual dispatch of this
# workflow with the same tag, which skips what is already on the registry. A
# prerelease uses the npm `next` dist-tag so it does not move stable `latest`.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    name: publish npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Node and npm pins match Falconiere/toolu-conventions, which already
      # publishes @toolu/create with this same NPM_TOKEN. Provenance needs
      # npm >= 11.5.1, and setup-node ships whatever npm Node bundles, which
      # is older.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: Set up an npm new enough to attest provenance
        run: npm install --global npm@11.5.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Verify the npm file list
        run: cargo xtask gate --only pack

      - name: Check the tag matches every package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          for dir in tools/toolu-cli/npm tools/toolu-opencode/npm; do
            if [ ! -f "$dir/package.json" ]; then
              echo "$dir/package.json not found at $tag" >&2
              exit 1
            fi
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$dir is private at $tag; skipping"
              continue
            fi
            pkg=$(node -p "require('./$dir/package.json').version")
            if [ "v$pkg" != "$tag" ]; then
              echo "tag $tag does not match $dir version $pkg" >&2
              exit 1
            fi
          done
          echo "publishing $tag"

      # A failure ABORTS rather than continuing, so one run never publishes a
      # partial set past a failure. Packages already published are skipped, so a
      # re-run resumes from the one that failed.
      - name: Publish
        run: |
          set -uo pipefail
          npm_tag=latest
          if [[ "$TAG" == *-* ]]; then npm_tag=next; fi
          for dir in tools/toolu-cli/npm tools/toolu-opencode/npm; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "$dir is private at $TAG; skipping"
              continue
            fi
            name=$(node -p "require('./$dir/package.json').name")
            pkg=$(node -p "require('./$dir/package.json').version")
            if out=$(npm view "$name@$pkg" version 2>&1); then
              echo "$name@$pkg is already published ($out); skipping"
              continue
            elif ! printf '%s' "$out" | grep -q 'E404'; then
              echo "npm view failed for $name for a reason other than the version being absent:" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            echo "publishing $name@$pkg"
            if ! ( cd "$dir" && npm publish --provenance --access public --tag "$npm_tag" ); then
              echo "publishing $name@$pkg failed; stopping" >&2
              exit 1
            fi
          done
        env:
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}

      # A re-run skips a version that is already on the registry, then deprecates
      # again. A prerelease stays on `next` and leaves stable versions alone.
      - name: Deprecate every published version
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease $TAG leaves existing deprecations unchanged"
            exit 0
          fi
          npm deprecate @toolu/plugins@"*" "@toolu/plugins is deprecated. Install the native binary with the installer or Homebrew, then run toolu plugins install. https://github.com/Falconiere/toolu/blob/main/docs/install.md"
          npm deprecate @toolu/opencode@"*" "@toolu/opencode is deprecated. Install the native binary with the installer or Homebrew, then run toolu plugins install --host opencode. https://github.com/Falconiere/toolu/blob/main/docs/opencode.md"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}

  # Nothing needs this job: release-please.yml runs `publish` after the native
  # release. It only turns the run red when npm has not made
  # the version visible within its window.
  verify:
    name: verify npm packages resolve
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The per-version document, registry.npmjs.org/<name>/<version>, is served
      # uncached (`cf-cache-status: DYNAMIC`), while the packument `npm view`
      # reads sits behind Cloudflare for up to five minutes (`max-age=300`,
      # revalidation answered from the edge). So this asks the registry itself.
      - name: Wait until every package resolves on the registry
        run: |
          set -euo pipefail
          for dir in tools/toolu-cli/npm tools/toolu-opencode/npm; do
            if [ "$(jq -r '.private == true' "$dir/package.json")" = "true" ]; then
              echo "$dir is private; nothing to wait for"
              continue
            fi
            name=$(jq -r .name "$dir/package.json")
            pkg=$(jq -r .version "$dir/package.json")
            url="https://registry.npmjs.org/${name/\//%2F}/$pkg"
            # Each package gets a full window, even when earlier packages
            # take most of theirs to propagate. The window ends inside this
            # job's timeout, so a stuck publish fails with the message below.
            deadline=$(( $(date +%s) + 30 * 60 ))
            until [ "$(curl -fs "$url" | jq -r .version 2>/dev/null || true)" = "$pkg" ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "$name@$pkg is still not on the registry: the publish was accepted but has not propagated; dispatch this workflow again with tag $TAG once it has" >&2
                exit 1
              fi
              echo "$name@$pkg is not on the registry yet; retrying in 15s"
              sleep 15
            done
            echo "$name@$pkg resolves on the registry"
          done
        env:
          TAG: ${{ inputs.tag }}

name: Toolu Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Same release-only set as tests.yml. A generated version bump does not
    # get a review call. A branch named release-please-- that changes anything
    # else still does: the name is not a signal.
    paths-ignore:
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "package.json"
      - "packages/*/package.json"
      - "tools/*/package.json"
      - "plugins/*/.claude-plugin/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: toolu-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: falconiere/toolu-ghactions/code-review@v8
        with:
          PROVIDER: openrouter
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # v5 defaults FAIL_ON to "changes", which fails this job whenever the
          # bot requests changes. Pinned to "none" to keep the v3 advisory
          # behaviour; drop this line to adopt the merge gate.
          FAIL_ON: none
          JEV_ENABLED: 'true'
          JEV_MODEL_ID: typesafe/jev-1.13
          # Custom App identity. Requires APP_ID + APP_PRIVATE_KEY secrets on
          # THIS repo and the App installed here; otherwise falls back to
          # github-actions[bot].
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # The `merge-gate` required check: the PR carries `merge-approved` and every
  # review thread has a reply from someone other than its opener. Evaluated
  # after the reviewer has posted, so a push is never judged against the
  # previous commit's findings; merge-gate.yml re-evaluates it on thread replies
  # and label changes. `!cancelled()`, not `always()`: a red `review` still
  # gets a verdict, but a run superseded by a newer push does not.
  merge-gate:
    needs: review
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: falconiere/toolu-ghactions/merge-gate@v8

name: Toolu Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # No workflow-level path filters (#458): a path-skipped workflow leaves the
    # required `review` check Pending. The `changes` job decides instead.

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: toolu-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same classifier as tests.yml (.github/ci-paths.json). `changed` is false
  # only for a release-please version bump.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.groups.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Classify the changed paths
        id: groups
        run: bun run tooling/src/ci-changes.ts

  # The required `review` check. Docs are reviewed too, so any change outside
  # the release-only files runs it. A release-only diff skips it through `if`,
  # which reports Success. If `changes` did not succeed or left `changed`
  # empty, review runs anyway: a skipped required check must never stand in
  # for a missing decision.
  review:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.changed != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: falconiere/toolu-ghactions/code-review@v8
        with:
          PROVIDER: openrouter
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # v5 defaults FAIL_ON to "changes", which fails this job whenever the
          # bot requests changes. Pinned to "none" to keep the review advisory.
          FAIL_ON: none
          JEV_ENABLED: 'true'
          JEV_MODEL_ID: typesafe/jev-1.13
          # Custom App identity. Requires APP_ID + APP_PRIVATE_KEY secrets on
          # THIS repo and the App installed here; otherwise falls back to
          # github-actions[bot].
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
